<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stormtrooper Helmet Swap | Jason Bodden</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet" />

<style>
  :root{
    --page:#000;
    --wrap:#111;
    --panel:#222;
    --ink:#f2f2f2;
    --radius:10px;
    --shadow:0 10px 30px rgba(0,0,0,.4);
    --border:2px solid #333;
  }

  body{
    margin:0;
    background:var(--page);
    color:var(--ink);
    text-align-last:center;
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }

  h1{
    font-family:'Titan One',cursive;
    margin:20px 0 2px;
    font-size:48px;
    color:#e03131;
  }

  p.lead{
    margin:6px 0 16px;
    font-weight:700;
    font-size:18px;
    color:#f5f5f5;
  }

  wrapper{
    display:grid;
    grid-template-columns:500px 140px;
    column-gap:10px;
    row-gap:10px;
    width:670px;
    height:680px;
    margin:0 auto;
    padding:10px;
    box-sizing:border-box;
    background:var(--wrap);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    position:relative;
  }

  #div1{
    width:500px;
    height:660px;
    position:relative;
    overflow:hidden;
    border:var(--border);
    border-radius:var(--radius);
    background:#000 url("trooperface.png") center top/cover no-repeat;
  }

  #div1::after{
    content:"";
    position:absolute;
    inset:0;
    box-shadow:inset 0 0 90px rgba(0,0,0,.5);
    pointer-events:none;
  }

  .hot{ outline:3px dashed rgba(255,255,255,.25); outline-offset:-6px; }

  .placed{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
  }

  .placed img{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%) translateY(-200px);
    transform-origin:top center;
    width:118%;
    max-width:none;
    filter:drop-shadow(0 12px 26px rgba(0,0,0,.7));
    transition:transform .15s ease;
    pointer-events:auto;
  }

  /* fine-tuned offsets so each helmet covers the whole face */
  #helm1_placed{ width:120%; transform:translateX(-50%) translateY(-215px); } /* blue */
  #helm2_placed{ width:118%; transform:translateX(-50%) translateY(-220px); } /* white */
  #helm3_placed{ width:119%; transform:translateX(-50%) translateY(-213px); } /* green */
  #helm4_placed{ width:121%; transform:translateX(-50%) translateY(-225px); } /* red */

  .right{
    width:140px;
    height:660px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .slot{
    width:125px;
    height:150px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel);
    border:var(--border);
    border-radius:var(--radius);
  }

  .slot:hover{ box-shadow:0 6px 14px rgba(255,255,255,.2); }

  .right img{
    width:100%;
    height:auto;
    cursor:grab;
    user-select:none;
  }

  .right img:hover{
    transform:scale(1.05);
    transition:transform .2s ease;
  }

  footer{
    position:static;
    font-size:12px;
    margin:16px auto 24px;
    max-width:670px;
    color:#bbb;
  }
</style>

<script>
  function allowDrop(ev){ ev.preventDefault(); }
  function drag(ev){
    ev.dataTransfer.setData("text", ev.target.id);
    document.getElementById('div1').classList.add('hot');
  }
  function drop(ev){
    ev.preventDefault();
    const id = ev.dataTransfer.getData("text");
    const img = document.getElementById(id);
    const left = document.getElementById('div1');
    const placed = document.getElementById('placed');
    if(!img || !left || !placed) return;
    left.classList.remove('hot');
    placed.innerHTML = "";
    const clone = img.cloneNode(true);
    clone.id = id + "_placed";
    clone.draggable = true;
    clone.addEventListener('dragstart', e=>{
      e.dataTransfer.setData("text", clone.id);
      left.classList.add('hot');
    });
    placed.appendChild(clone);
  }
  function leave(){ document.getElementById('div1').classList.remove('hot'); }
</script>
</head>

<body>
  <h1>Choose your Helment War</h1>
  <p class="lead">Drag a helmet from the right into the big panel.</p>

  <wrapper>
    <div id="div1" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="leave()">
      <div id="placed" class="placed"></div>
    </div>

    <div class="right">
      <div class="slot"><img id="helm1" src="stormtrooper1.png" draggable="true" ondragstart="drag(event)" alt="Helmet 1" /></div>
      <div class="slot"><img id="helm2" src="stormtrooper2.png" draggable="true" ondragstart="drag(event)" alt="Helmet 2" /></div>
      <div class="slot"><img id="helm3" src="stormtrooper3.png" draggable="true" ondragstart="drag(event)" alt="Helmet 3" /></div>
      <div class="slot"><img id="helm4" src="stormtrooper4.png" draggable="true" ondragstart="drag(event)" alt="Helmet 4" /></div>
    </div>
  </wrapper>

  <footer>© 2025 Jason Bodden. Educational project (HTML5 Drag & Drop).</footer>
</body>
</html>
